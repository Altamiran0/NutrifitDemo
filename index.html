<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nutrifit · Demo</title>
<style>
:root{--bg:#f3f6f0;--card:#fff;--tx:#16231a;--mu:#68786d;--br:#dde5da;--ac:#1f8a4c;--lm:#c6f03a;--dk:#0e3a22;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1510;--card:#16211a;--tx:#e8f0ea;--mu:#8fa196;--br:#25352b;--dk:#0a2617}}
:root[data-theme=dark]{--bg:#0d1510;--card:#16211a;--tx:#e8f0ea;--mu:#8fa196;--br:#25352b;--dk:#0a2617}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0 0 .5rem;letter-spacing:-.02em}small,.mu{color:var(--mu)}
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--dk);color:#dbeadf;padding:20px 14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.logo{font-weight:800;font-size:22px;color:#fff;margin-bottom:14px}.logo span{color:var(--lm)}
.side a{padding:10px 12px;border-radius:10px;cursor:pointer;color:#c5d8cb}.side a:hover{background:#ffffff14}.side a.on{background:var(--lm);color:#0e3a22;font-weight:700}
.me{margin-top:auto;padding:12px;border-radius:12px;background:#ffffff12;font-size:13px}.me b{display:block;color:#fff}
main{margin-left:236px;padding:28px;max-width:1100px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi b{display:block;font-size:30px;line-height:1.1}.kpi small{font-size:13px}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--br)}.btn.bad{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);font-weight:600}label input,label select,label textarea{margin-top:4px;font-weight:400}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--lm);color:#0e3a22;font-size:12px;font-weight:700}
.av{border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--br)}.row:last-child{border:0}.row>div{flex:1;min-width:0}.row.click{cursor:pointer}.row.click:hover{background:var(--bg)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs a{padding:7px 14px;border-radius:99px;border:1px solid var(--br);cursor:pointer;font-size:14px}.tabs a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:linear-gradient(var(--lm),var(--ac));border-radius:6px 6px 0 0;margin-bottom:4px}
.ph{display:flex;gap:16px;align-items:center;margin:14px 0}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--br);font-size:14px}th{color:var(--mu);font-size:12px}
.chat{display:grid;grid-template-columns:260px 1fr;height:66vh;background:var(--card);border:1px solid var(--br);border-radius:16px;overflow:hidden}
.cl{border-right:1px solid var(--br);overflow:auto}.ci{display:flex;gap:10px;padding:12px;cursor:pointer;align-items:center}.ci.on,.ci:hover{background:var(--bg)}.ci small{display:block}
.cm{display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:70%;padding:8px 13px;border-radius:14px;background:var(--bg);align-self:flex-start}.b.me{background:var(--ac);color:#fff;align-self:flex-end}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--br)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#1f8a4c55,transparent 50%),var(--dk);color:#fff}
.login .card{color:var(--tx);cursor:pointer;text-align:center;margin:0}.login .card:hover{outline:2px solid var(--lm)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 20px;border-radius:99px;z-index:9;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
.star{color:#e0a400}
@media(max-width:820px){.side{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:10px}.side .logo,.me{display:none}.side a{white-space:nowrap}main{margin:0;padding:16px}.chat{grid-template-columns:1fr;height:auto}.cl{display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--br)}.msgs{height:44vh}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const RL={admin:'Administración',nutri:'Nutricionista',trainer:'Entrenador/a',client:'Cliente'};
const U=[],M={};let n=0;
const mk=(role,name,o={})=>{const u={id:role[0]+(++n),role,name,dni:(20+n*3)+'.4'+n+'5.'+(100+n*17),email:name.split(' ')[0].toLowerCase()+'@mail.com',tel:'11 5555-'+(1000+n*37),docs:[],...o};U.push(u);return u};
const D0=[{m:'Desayuno',t:'Avena con frutas y yogur natural',s:'Sumá una cucharada de semillas de chía'},{m:'Almuerzo',t:'Pollo grillado, arroz integral y ensalada',s:'Porción de proteína del tamaño de la palma'},{m:'Merienda',t:'Tostada integral con palta',s:'Podés reemplazar por frutos secos'},{m:'Cena',t:'Tortilla de verduras y ensalada verde',s:'Cenar 2 h antes de dormir'}];
const E0=[{n:'Sentadilla goblet',s:'4 × 12',c:'Espalda recta, rodillas alineadas con los pies, bajá controlado.'},{n:'Press de banca con mancuernas',s:'3 × 10',c:'Codos a 45°, bajá en 3 segundos y empujá sin bloquear.'},{n:'Plancha abdominal',s:'3 × 40 s',c:'Cuerpo en línea recta, glúteos apretados.'}];
const cp=x=>JSON.parse(JSON.stringify(x));
mk('admin','Lucía Fernández');
mk('nutri','Camila Ríos',{esp:'Nutrición deportiva',mat:'MN 4521',hor:'Lun–Vie 9:00–15:00'});
mk('nutri','Martín Acosta',{esp:'Nutrición clínica',mat:'MN 5310',hor:'Mar–Sáb 12:00–19:00'});
mk('trainer','Joaquín Paz',{esp:'Fuerza e hipertrofia',mat:'Prof. Ed. Física',hor:'Lun–Vie 7:00–14:00'});
mk('trainer','Valeria Sosa',{esp:'Funcional y cardio',mat:'Prof. Ed. Física',hor:'Lun–Vie 14:00–22:00'});
const cl=[['Sofía Márquez','n2','t4','Bajar 6 kg en 4 meses',[74,73.2,72.5,71.4]],['Tomás Herrera','n2','t4','Ganar masa muscular',[68,68.6,69.3,70]],['Julieta Ponce','n3','t5','Mejorar resistencia',[61,60.5,60.4,60]],['Nicolás Vega','n3','t4','Control de colesterol',[92,91,89.5,88.7]],['Agustina Luna','n2','t5','Tonificar y ganar energía',[65,64.5,64.1,63.8]],['Bruno Castro',null,null,'Sin definir (alta reciente)',[80]]];
cl.forEach(([nm,a,b,g,w],i)=>mk('client',nm,{id:'c'+(i+1),n:a,t:b,goal:g,h:160+i*4,age:24+i*3,cond:i==3?'Hipercolesterolemia':'Ninguna',w:w.map((v,j)=>({d:'Sem '+(j+1),v})),docs:i<3?[{n:'Receta_medica.pdf',d:'12 sep 2026'},{n:'Analisis_sangre.pdf',d:'20 sep 2026'}].slice(0,i==2?1:2):[],diet:a?cp(D0):[],ex:b?cp(E0):[],appts:a?[{d:'Mié 30 sep · 10:00',w:'Nutricionista'},{d:'Vie 2 oct · 18:00',w:'Entrenamiento'}]:[],abs:{}}));
const RV=[['n2','c1',5,'Camila me explicó todo con paciencia. ¡Excelente!'],['n2','c2',5,'Plan muy claro y fácil de seguir.'],['n2','c5',4,'Muy buena atención, a veces cuesta conseguir turno.'],['n3','c3',4,'Muy profesional.'],['n3','c4',5,'Me ayudó a bajar mi colesterol.'],['t4','c1',5,'Las rutinas son geniales.'],['t4','c2',4,'Motivador, corrige la técnica siempre.'],['t4','c4',4,'Buen seguimiento.'],['t5','c3',5,'Clases dinámicas y divertidas.'],['t5','c5',3,'Me gustaría más variedad de ejercicios.']];
const key=(a,b)=>[a,b].sort().join('_');
const say=(a,b,t)=>(M[key(a,b)]=M[key(a,b)]||[]).push({f:a,t});
say('n2','c1','¡Hola Sofía! Cómo te fue con el plan esta semana?');say('c1','n2','Muy bien, pude cumplir casi todo 💪');say('t4','c1','Recordá traer la toalla mañana');say('a1','c6','¡Bienvenido a Nutrifit! Cualquier duda escribinos por acá.');
let S={u:null,view:'',f:'client',sel:null,tab:'d',cw:null};
const byId=id=>U.find(u=>u.id==id),cur=()=>byId(S.u),ini=u=>u.name.split(' ').map(x=>x[0]).join('');
const av=(u,s=40)=>`<div class=av style="width:${s}px;height:${s}px;font-size:${s/2.6}px">${ini(u)}</div>`;
const avg=id=>{const r=RV.filter(x=>x[0]==id);return r.length?(r.reduce((a,x)=>a+x[2],0)/r.length):0};
const stars=v=>'<span class=star>'+'★'.repeat(Math.round(v))+'☆'.repeat(5-Math.round(v))+'</span> '+v.toFixed(1);
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2200)};
const NAV={admin:[['panel','Panel general'],['registrar','Registrar usuario'],['personas','Personas'],['asig','Asignaciones'],['chat','Mensajes']],nutri:[['clientes','Mis clientes'],['chat','Chats'],['horarios','Mi agenda']],trainer:[['clientes','Mis clientes'],['chat','Chats'],['horarios','Mi agenda']],client:[['plan','Mi dieta'],['ejer','Mis ejercicios'],['docs','Documentos'],['citas','Citas y horarios'],['chat','Chats']]};
function login(role){S.u=U.find(u=>u.role==role&&(role!='client'||u.id=='c1')).id;S.view=NAV[role][0][0];S.cw=null;R()}
const go=v=>{S.view=v;S.sel=null;S.tab='d';R()};
function R(){const a=document.getElementById('app');if(!S.u){a.innerHTML=`<div class=login><div style="max-width:820px;width:100%"><h1 style="font-size:40px">Nutri<span style="color:var(--lm)">fit</span></h1><p style="opacity:.8;margin-bottom:24px">Gimnasio y consultorios de nutrición · Demo interactiva. Elegí un rol para ingresar:</p><div class=grid>${[['admin','🗂️','Administración','Recepción: registra y asigna'],['nutri','🥗','Nutricionista','Dietas y seguimiento'],['trainer','🏋️','Entrenador/a','Rutinas y progreso'],['client','🙋','Cliente','Mi plan y mis citas']].map(([r,i,t,d])=>`<div class=card onclick="login('${r}')"><div style="font-size:34px">${i}</div><h3>${t}</h3><small>${d}</small></div>`).join('')}</div></div></div>`;return}
const me=cur();let v=S.sel?vPerfil():(VW[S.view]||(()=>''))();
a.innerHTML=`<nav class=side><div class=logo>Nutri<span>fit</span></div>${NAV[me.role].map(([k,t])=>`<a class="${S.view==k?'on':''}" onclick="go('${k}')">${t}</a>`).join('')}<div class=me><b>${me.name}</b>${RL[me.role]}<br><a style="padding:6px 0 0;color:var(--lm)" onclick="S.u=null;R()">↩ Cambiar rol</a></div></nav><main>${v}</main>`;
const m=document.querySelector('.msgs');if(m)m.scrollTop=m.scrollHeight}
const bars=(v,l)=>{const mx=Math.max(...v);return `<div class=bars>${v.map((x,i)=>`<div><i style="height:${x/mx*100}%"></i>${l[i]}<br><b style="color:var(--tx)">${x}</b></div>`).join('')}</div>`};
const cls=()=>U.filter(u=>u.role=='client');
const VW={
panel(){const c=cls(),s=U.filter(u=>u.role=='nutri'||u.role=='trainer');return `<h2>Panel general</h2><p class=mu>Estadísticas de Nutrifit · septiembre 2026</p><div class=grid style="margin:14px 0"><div class="card kpi"><b>${c.length+112}</b><small>Socios activos</small></div><div class="card kpi"><b>${s.length}</b><small>Profesionales</small></div><div class="card kpi"><b>${c.filter(x=>!x.n||!x.t).length}</b><small>Socios con asignación pendiente</small></div><div class="card kpi"><b>4,4 ★</b><small>Satisfacción promedio</small></div></div><div class=grid><div class=card><h3>Asistencias por día</h3>${bars([84,92,88,76,95,48],['Lun','Mar','Mié','Jue','Vie','Sáb'])}</div><div class=card><h3>Nuevos socios por mes</h3>${bars([14,18,12,22,27,31],['Abr','May','Jun','Jul','Ago','Sep'])}</div><div class=card><h3>Objetivos de los socios</h3>${bars([46,31,18,17],['Bajar peso','Masa musc.','Salud','Rendim.'])}</div></div>`},
registrar(){return `<h2>Registrar nuevo usuario</h2><form class=card onsubmit="reg(event)"><label style="max-width:320px;margin-bottom:12px">Rol del usuario<select name=rol onchange="sw(this.value)"><option value=client>Cliente / Socio</option><option value=nutri>Nutricionista</option><option value=trainer>Entrenador/a</option></select></label><div class=f2><label>Nombre<input name=nombre required></label><label>Apellido<input name=apellido required></label><label>DNI<input name=dni required></label><label>Email<input type=email name=email required></label><label>Teléfono<input name=tel></label><label>Fecha de nacimiento<input type=date name=nac></label></div>
<div class=f2 data-for=client><label>Peso actual (kg)<input type=number name=peso step=.1></label><label>Altura (cm)<input type=number name=alt></label><label>Objetivo principal<input name=goal placeholder="Ej: bajar 5 kg"></label><label>Condiciones médicas<input name=cond placeholder="Alergias, patologías…"></label><label>Nutricionista (opcional)<select name=n><option value="">— Sin asignar —</option>${opts('nutri')}</select></label><label>Entrenador/a (opcional)<select name=t><option value="">— Sin asignar —</option>${opts('trainer')}</select></label></div>
<div class=f2 data-for=nutri hidden><label>Matrícula profesional<input name=mat></label><label>Especialidad<input name=esp placeholder="Ej: Nutrición deportiva"></label><label>Horarios de atención<input name=hor placeholder="Lun–Vie 9–15"></label><label>Consultorio<select name=cons><option>Consultorio 1</option><option>Consultorio 2</option></select></label></div>
<div class=f2 data-for=trainer hidden><label>Título / certificación<input name=mat></label><label>Especialidad<input name=esp placeholder="Ej: Funcional"></label><label>Horarios<input name=hor placeholder="Lun–Vie 7–14"></label><label>Sala asignada<select name=sala><option>Sala de musculación</option><option>Sala funcional</option></select></label></div><button class=btn>Registrar usuario</button></form>`},
personas(){const l=U.filter(u=>u.role==S.f);return `<h2>Personas registradas</h2><div class=tabs>${['client','nutri','trainer','admin'].map(r=>`<a class="${S.f==r?'on':''}" onclick="S.f='${r}';R()">${RL[r]} (${U.filter(u=>u.role==r).length})</a>`).join('')}</div><div class=card>${l.map(u=>`<div class="row click" onclick="S.sel='${u.id}';S.tab='d';R()">${av(u)}<div><b>${u.name}</b><br><small>${u.email} · ${u.tel}</small></div><small>${u.role=='client'?(u.n?byId(u.n).name:'Sin nutri')+' · '+(u.t?byId(u.t).name:'Sin entrenador'):u.esp||''}</small></div>`).join('')}</div>`},
asig(){return `<h2>Asignaciones</h2><p class=mu>Asigná, cambiá o quitá el profesional de cada socio.</p><div class=card style="overflow:auto"><table><tr><th>Socio<th>Nutricionista<th>Entrenador/a<th></tr>${cls().map(c=>`<tr><td><b>${c.name}</b><td><select onchange="asg('${c.id}','n',this.value)"><option value="">— Sin asignar —</option>${opts('nutri',c.n)}</select><td><select onchange="asg('${c.id}','t',this.value)"><option value="">— Sin asignar —</option>${opts('trainer',c.t)}</select><td>${c.n||c.t?`<button class="btn bad sm" onclick="asg('${c.id}','n','');asg('${c.id}','t','')">Desasignar todo</button>`:'<span class=tag>Pendiente</span>'}</tr>`).join('')}</table></div>`},
resenas(){return `<h2>Reseñas y estadísticas</h2><p class=mu>Valoraciones de los clientes a sus profesionales.</p>${U.filter(u=>u.role=='nutri'||u.role=='trainer').map(p=>`<div class=card><div class=row style="border:0">${av(p)}<div><b>${p.name}</b> <span class=tag>${RL[p.role]}</span><br><small>${cls().filter(c=>c.n==p.id||c.t==p.id).length} clientes a cargo · ${RV.filter(r=>r[0]==p.id).length} reseñas</small></div><div style="font-size:18px">${stars(avg(p.id))}</div></div>${RV.filter(r=>r[0]==p.id).map(r=>`<div class=row><div><small><b>${byId(r[1]).name}</b> · ${'★'.repeat(r[2])}</small><br>${r[3]}</div></div>`).join('')}</div>`).join('')}`},
chat:vChat,
clientes(){const me=cur(),l=cls().filter(c=>c[me.role=='nutri'?'n':'t']==me.id);return `<h2>Mis clientes</h2><p class=mu>${l.length} clientes a tu cargo</p><div class=card>${l.map(c=>`<div class="row click" onclick="S.sel='${c.id}';S.tab='d';R()">${av(c)}<div><b>${c.name}</b><br><small>${c.goal}</small></div><small>${c.w[c.w.length-1].v} kg</small></div>`).join('')||'<p class=mu>Sin clientes asignados</p>'}</div>`},
horarios(){const me=cur();return `<h2>Mi agenda</h2><div class=card><p><b>Horario de atención:</b> ${me.hor}</p><table><tr><th>Hora<th>Cliente<th>Motivo</tr>${cls().filter(c=>c[me.role=='nutri'?'n':'t']==me.id).map((c,i)=>`<tr><td>${['10:00','11:00','16:00','17:30'][i]}<td>${c.name}<td>${me.role=='nutri'?'Control y ajuste de dieta':'Entrenamiento personalizado'}</tr>`).join('')}</table></div>`},
plan(){return `<h2>Mi dieta</h2>${dietH(cur(),false)}`},
ejer(){return `<h2>Mis ejercicios</h2>${exH(cur(),false)}`},
docs(){const u=cur();return `<h2>Mis documentos</h2><div class=card><p class=mu>Subí recetas médicas, análisis u otros documentos. Tus profesionales podrán verlos.</p><input type=file id=fi onchange="upl()"><div style="margin-top:12px">${docsH(u)}</div></div>`},
citas(){const u=cur();return `<h2>Citas y horarios</h2><div class=card><h3>Próximas citas</h3>${u.appts.map((a,i)=>`<div class=row><div><b>${a.d}</b><br><small>${a.w} · ${a.w=='Nutricionista'?(u.n?byId(u.n).name:''):(u.t?byId(u.t).name:'')}</small></div>${u.abs[i]?'<span class=tag style="background:#f3c4c4">Inasistencia avisada</span>':`<button class="btn ghost sm" onclick="cur().abs[${i}]=1;R();toast('Aviso enviado a tu profesional')">Avisar inasistencia</button>`}</div>`).join('')||'<p class=mu>No tenés citas programadas</p>'}</div><div class=card><h3>Horarios</h3><table><tr><th>Gimnasio<th>Horario</tr><tr><td>Lunes a viernes<td>7:00 – 22:00</tr><tr><td>Sábados<td>9:00 – 15:00</tr><tr><td>Consultorios de nutrición<td>Lun a sáb 9:00 – 19:00</tr></table></div>`}};
const opts=(r,s)=>U.filter(u=>u.role==r).map(u=>`<option value=${u.id} ${u.id==s?'selected':''}>${u.name}</option>`).join('');
const sw=v=>document.querySelectorAll('[data-for]').forEach(e=>e.hidden=e.dataset.for!=v);
function asg(c,k,v){const u=byId(c);u[k]=v||null;if(k=='n'&&v&&!u.diet.length)u.diet=[];R();toast('Asignación actualizada')}
function reg(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),nm=f.nombre+' '+f.apellido;const o={dni:f.dni,email:f.email,tel:f.tel};
if(f.rol=='client')Object.assign(o,{n:f.n||null,t:f.t||null,goal:f.goal||'Sin definir',h:f.alt,age:f.nac?new Date().getFullYear()-f.nac.slice(0,4):'—',cond:f.cond||'Ninguna',w:f.peso?[{d:'Alta',v:+f.peso}]:[{d:'Alta',v:0}],diet:[],ex:[],appts:[],abs:{}});else Object.assign(o,{esp:f.esp,mat:f.mat,hor:f.hor});
mk(f.rol,nm,o);S.f=f.rol;S.view='personas';R();toast(nm+' registrado/a correctamente')}
const docsH=u=>u.docs.map(d=>`<div class=row><span style="font-size:22px">📄</span><div><b>${d.n}</b><br><small>Cargado el ${d.d}</small></div><button class="btn ghost sm" onclick="toast('Vista previa (demo)')">Ver</button></div>`).join('')||'<p class=mu>Sin documentos cargados</p>';
function upl(){const f=document.getElementById('fi').files[0];if(!f)return;cur().docs.push({n:f.name,d:'28 sep 2026'});R();toast('Documento cargado')}
const dietH=(u,ed)=>`<div class=card>${u.diet.map((d,i)=>`<div class=row><span class=tag>${d.m}</span><div><b>${d.t}</b><br><small>💡 ${d.s}</small></div>${ed?`<button class="btn bad sm" onclick="byId('${u.id}').diet.splice(${i},1);R()">✕</button>`:''}</div>`).join('')||'<p class=mu>Todavía no tenés una dieta asignada.</p>'}</div>${ed?`<div class=card><h3>Agregar comida</h3><div class=f2><label>Momento<select id=dm><option>Desayuno<option>Almuerzo<option>Merienda<option>Cena<option>Colación</select></label><label>Comida<input id=dt></label><label>Sugerencia<input id=ds></label></div><button class=btn onclick="addD('${u.id}')">Asignar</button></div>`:''}`;
const exH=(u,ed)=>`<div class=card>${u.ex.map((d,i)=>`<div class=row><span class=tag>${d.s}</span><div><b>${d.n}</b><br><small>📝 ${d.c}</small></div>${ed?`<button class="btn bad sm" onclick="byId('${u.id}').ex.splice(${i},1);R()">✕</button>`:''}</div>`).join('')||'<p class=mu>Todavía no tenés ejercicios asignados.</p>'}</div>${ed?`<div class=card><h3>Asignar ejercicio</h3><div class=f2><label>Ejercicio<input id=en></label><label>Series × reps<input id=es placeholder="3 × 12"></label><label>Cómo realizarlo<input id=ec></label></div><button class=btn onclick="addE('${u.id}')">Asignar</button></div>`:''}`;
const $v=id=>document.getElementById(id).value;
function addD(id){if(!$v('dt'))return toast('Completá la comida');byId(id).diet.push({m:$v('dm'),t:$v('dt'),s:$v('ds')||'—'});R();toast('Dieta actualizada')}
function addE(id){if(!$v('en'))return toast('Completá el ejercicio');byId(id).ex.push({n:$v('en'),s:$v('es')||'3 × 10',c:$v('ec')||'—'});R();toast('Ejercicio asignado')}
function addW(id){const v=parseFloat($v('nw'));if(!v)return;const u=byId(id);u.w.push({d:'Sem '+(u.w.length+1),v});R();toast('Progreso actualizado')}
function saveG(id){byId(id).goal=$v('ng');toast('Objetivo actualizado')}
function perf(u,c){const k=+u.id.slice(1),rv=RV.filter(r=>r[0]==u.id),kp=(b,s)=>`<div class="card kpi" style="margin:0"><b>${b}</b><small>${s}</small></div>`;
return `<h3 style="margin-top:8px">Desempeño</h3><div class=grid style="margin-bottom:16px">${kp(c.length,'Clientes a cargo')}${kp(avg(u.id).toFixed(1)+' ★',rv.length+' reseñas')}${kp((90+k%7)+'%','Asistencia a turnos')}${kp((60+k*3%25)+'%','Objetivos cumplidos')}</div><div class=card><h3>Sesiones por mes</h3>${bars([38+k,42+k,40,51,55+k,58],['Abr','May','Jun','Jul','Ago','Sep'])}</div><div class=card><h3>Clientes a cargo</h3>${c.map(x=>`<div class="row click" onclick="S.sel='${x.id}';S.tab='d';R()">${av(x,32)}<div><b>${x.name}</b><br><small>${x.goal}</small></div></div>`).join('')||'<p class=mu>Sin clientes asignados</p>'}</div><div class=card><h3>Reseñas de sus clientes</h3><p style="font-size:18px">${stars(avg(u.id))}</p>${rv.map(r=>`<div class=row><div><small><b>${byId(r[1]).name}</b> · <span class=star>${'★'.repeat(r[2])}</span></small><br>${r[3]}</div></div>`).join('')||'<p class=mu>Aún sin reseñas</p>'}</div>`}
function vPerfil(){const u=byId(S.sel),me=cur();let h=`<button class="btn ghost sm" onclick="S.sel=null;R()">← Volver</button><div class=ph>${av(u,64)}<div><h2 style="margin:0">${u.name}</h2><span class=tag>${RL[u.role]}</span></div></div>`;
if(u.role!='client'){const c=cls().filter(x=>x.n==u.id||x.t==u.id);return h+`<div class=card><div class=f2>${[['DNI',u.dni],['Email',u.email],['Teléfono',u.tel],['Especialidad',u.esp||'—'],['Matrícula / título',u.mat||'—'],['Horarios',u.hor||'—']].map(([a,b])=>`<div><small>${a}</small><br><b>${b}</b></div>`).join('')}</div></div>${u.role!='admin'?perf(u,c):''}`}
const T=[['d','Datos'],['x','Documentos'],['p','Progreso y objetivos']];if(me.role!='trainer')T.push(['n','Dieta']);if(me.role!='nutri')T.push(['e','Ejercicios']);
h+=`<div class=tabs>${T.map(([k,t])=>`<a class="${S.tab==k?'on':''}" onclick="S.tab='${k}';R()">${t}</a>`).join('')}</div>`;
const w=u.w[u.w.length-1].v;
if(S.tab=='d')h+=`<div class=card><div class=f2>${[['DNI',u.dni],['Email',u.email],['Teléfono',u.tel],['Edad',u.age],['Altura',u.h+' cm'],['Peso actual',w+' kg'],['Condiciones médicas',u.cond],['Nutricionista',u.n?byId(u.n).name:'Sin asignar'],['Entrenador/a',u.t?byId(u.t).name:'Sin asignar']].map(([a,b])=>`<div><small>${a}</small><br><b>${b}</b></div>`).join('')}</div></div>`;
if(S.tab=='x')h+=`<div class=card>${docsH(u)}</div>`;
if(S.tab=='p'){const ed=me.role=='nutri'||me.role=='trainer';h+=`<div class=card><h3>Evolución de peso (kg)</h3>${bars(u.w.map(x=>x.v),u.w.map(x=>x.d))}</div><div class=card><label>Objetivo actual<input id=ng value="${u.goal}" ${ed?'':'disabled'}></label>${ed?`<button class="btn sm" style="margin-top:10px" onclick="saveG('${u.id}')">Guardar objetivo</button><hr style="border:0;border-top:1px solid var(--br);margin:16px 0"><label style="max-width:240px">Registrar nuevo peso (kg)<input id=nw type=number step=.1></label><button class="btn sm" style="margin-top:10px" onclick="addW('${u.id}')">Actualizar progreso</button>`:''}</div>`}
if(S.tab=='n')h+=dietH(u,me.role=='nutri');if(S.tab=='e')h+=exH(u,me.role=='trainer');
if(me.role!='admin')h+=`<button class=btn onclick="S.cw='${u.id}';S.sel=null;S.view='chat';R()">💬 Chatear con ${u.name.split(' ')[0]}</button>`;return h}
function vChat(){const me=cur();let l=me.role=='client'?[me.n&&byId(me.n),me.t&&byId(me.t),U[0]].filter(Boolean):cls().filter(c=>me.role=='admin'||c[me.role=='nutri'?'n':'t']==me.id);
if(!l.find(x=>x.id==S.cw))S.cw=l[0]&&l[0].id;const ms=S.cw?M[key(me.id,S.cw)]||[]:[];
return `<h2>${me.role=='admin'?'Mensajes':'Chats privados'}</h2><div class=chat><div class=cl>${l.map(c=>`<div class="ci ${c.id==S.cw?'on':''}" onclick="S.cw='${c.id}';R()">${av(c,36)}<div><b>${c.name}</b><small>${RL[c.role]}</small></div></div>`).join('')||'<p class=mu style="padding:14px">Sin contactos</p>'}</div><div class=cm><div class=msgs>${ms.map(m=>`<div class="b ${m.f==me.id?'me':''}">${m.t}</div>`).join('')||'<p class=mu>Sin mensajes todavía. ¡Escribí el primero!</p>'}</div><div class=send><input id=mi placeholder="Escribí un mensaje…" onkeydown="if(event.key=='Enter')snd()"><button class=btn onclick="snd()">Enviar</button></div></div></div>`}
function snd(){const t=$v('mi').trim(),me=cur(),o=S.cw;if(!t||!o)return;say(me.id,o,t);R();document.getElementById('mi').focus();setTimeout(()=>{say(o,me.id,'¡Gracias por tu mensaje! Te respondo a la brevedad. 👍');if(S.u==me.id&&S.cw==o&&S.view=='chat')R()},1400)}
R();
</script></body></html>
